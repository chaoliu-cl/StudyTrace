name: Android build

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The repository has no Gradle wrapper, so setup-gradle provisions a
      # pinned Gradle. 8.9 is the minimum for AGP 8.7.x (android/build.gradle.kts)
      # and works with Kotlin Gradle plugin 2.0.21.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The ubuntu runner image ships the Android SDK (ANDROID_HOME) with
      # licenses accepted; AGP downloads any missing platform/build-tools.
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon -p android :app:assembleDebug :app:testDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
