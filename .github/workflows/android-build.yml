name: Android build

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CI-only release signing key
        run: >-
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/studytrace-ci.jks"
          -storepass ci-test-only -keypass ci-test-only -alias ci-upload
          -keyalg RSA -keysize 2048 -validity 1 -dname "CN=StudyTrace CI"

      - name: Build, test, lint, and verify release bundle
        env:
          STUDYTRACE_UPLOAD_STORE_FILE: ${{ runner.temp }}/studytrace-ci.jks
          STUDYTRACE_UPLOAD_STORE_PASSWORD: ci-test-only
          STUDYTRACE_UPLOAD_KEY_ALIAS: ci-upload
          STUDYTRACE_UPLOAD_KEY_PASSWORD: ci-test-only
        run: ./android/gradlew -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
