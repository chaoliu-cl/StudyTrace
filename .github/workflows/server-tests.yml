name: Server tests

on:
  pull_request:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.js"
      - "test/**"
      - ".github/workflows/server-tests.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "index.js"
      - "test/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Install the root Express app used by Azure and root-directory Railway builds.
      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
